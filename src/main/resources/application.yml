spring:
  application:
    name: galgot

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/galgot?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:galgot}
    password: ${DB_PASSWORD:galgot}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway가 관리, JPA는 검증만
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Seoul

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 외부 API (키는 반드시 환경 변수로 주입)
external:
  tourapi:
    base-url: https://apis.data.go.kr/B551011/KorService2
    service-key: ${TOURAPI_SERVICE_KEY:}
  kma:
    service-key: ${KMA_SERVICE_KEY:}

logging:
  level:
    org.hibernate.SQL: debug

collect:
  run-on-startup: ${COLLECT_RUN_ON_STARTUP:false}
  regions: [11 , 41]
  content-types: [12, 14, 28]
  page-size: 100
  max-calls-per-run: 300

classify:
  run-on-startup: ${CLASSIFY_RUN_ON_STARTUP:false}

# 날씨기반 일차별 코스 추천: 하루에 추천할 장소 수(사용자가 고르지 않는다)
recommend:
  course:
    places-per-day: 4

# 장소 상세 정보(TourAPI 상세 API)를 DB에 저장해 두고 다시 받기까지의 기간
place:
  detail:
    cache-days: 30

server:
  servlet:
    session:
      cookie:
        same-site: lax

